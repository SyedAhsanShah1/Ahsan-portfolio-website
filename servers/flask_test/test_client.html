<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Test Client</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .chat-box { border: 1px solid #ddd; padding: 1rem; height: 300px; overflow-y: auto; margin-bottom: 1rem; background: #f9f9f9; }
        .message { margin-bottom: 0.5rem; padding: 0.5rem; border-radius: 4px; }
        .user { background-color: #e3f2fd; text-align: right; }
        .bot { background-color: #f1f8e9; text-align: left; }
        .input-area { display: flex; gap: 0.5rem; }
        input { flex: 1; padding: 0.5rem; }
        button { padding: 0.5rem 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <h2>Chatbot Test</h2>
    <div class="chat-box" id="chat-box"></div>
    <div class="input-area">
        <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('message-input');

        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // Display user message
            addMessage(text, 'user');
            messageInput.value = '';

            try {
                const response = await fetch('http://localhost:5000/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.reply || `Server error: ${response.status}`);
                }

                const data = await response.json();
                addMessage(data.reply, 'bot');
            } catch (error) {
                addMessage(`Error: ${error.message}`, 'bot');
            }
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
